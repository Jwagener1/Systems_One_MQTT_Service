name: Build, Test and Package Installer

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: windows-latest

    permissions:
      contents: write

    steps:
      # 1. Check out the repository code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Set up .NET 8 SDK
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # 3. Restore NuGet packages
      - name: Restore dependencies
        run: dotnet restore Systems_One_MQTT_Service.sln

      # 4. Build the solution
      - name: Build
        run: dotnet build Systems_One_MQTT_Service.sln --configuration Release --no-restore

      # 5. Run tests
      - name: Run tests
        run: dotnet test Tests/Systems_One_MQTT_Service.Tests.csproj --configuration Release --no-build --verbosity normal

      # 6. Generate version number (date + run number)
      - name: Set version
        id: version
        run: |
          $version = "v$(Get-Date -Format 'yyyy.MM.dd').${{ github.run_number }}"
          echo "VERSION=$version" >> $env:GITHUB_OUTPUT
        shell: pwsh

      # 7. Publish as self-contained Windows x64
      - name: Publish application
        run: >
          dotnet publish Systems_One_MQTT_Service.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          --output ./publish
          -p:PublishSingleFile=false

      # 8. Compile the Inno Setup installer
      - name: Build Inno Setup Installer
        uses: Minionguyjpro/Inno-Setup-Action@v1.2.2
        with:
          path: setup.iss
          options: /O+

      # 9. Create GitHub Release with installer
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.VERSION }}
          name: "Release ${{ steps.version.outputs.VERSION }}"
          body: |
            Automated release built from commit ${{ github.sha }}.

            ### What's included
            - `Systems_One_MQTT_Service_Setup.exe` — Windows installer for the MQTT Service

            ### Installation
            Run the installer as Administrator. It will automatically install and start the Windows Service.

            ### Post-install: Set credentials
            On the installed machine, configure secrets via environment variables or run:
            ```
            dotnet user-secrets set "Database:Username" "<value>"
            dotnet user-secrets set "Database:Password" "<value>"
            dotnet user-secrets set "Mqtt:Username" "<value>"
            dotnet user-secrets set "Mqtt:Password" "<value>"
            ```
          files: installer_output/Systems_One_MQTT_Service_Setup.exe
          draft: false
          prerelease: false
