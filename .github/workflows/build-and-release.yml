name: Build, Test and Package Installer

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    name: Run Tests

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore Systems_One_MQTT_Service.sln

      - name: Build
        run: dotnet build Systems_One_MQTT_Service.sln --configuration Release --no-restore

      - name: Run tests
        run: >
          dotnet test Tests/Systems_One_MQTT_Service.Tests.csproj
          --configuration Release
          --no-build
          --verbosity normal
          --logger "trx;LogFileName=test-results.trx"

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: Tests/TestResults/test-results.trx

  build-and-release:
    runs-on: windows-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'

    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore Systems_One_MQTT_Service.sln

      - name: Build
        run: dotnet build Systems_One_MQTT_Service.sln --configuration Release --no-restore

      - name: Set version
        id: version
        run: |
          $numeric = "$(Get-Date -Format 'yyyy.MM.dd').${{ github.run_number }}"
          $tag = "v$numeric"
          echo "VERSION=$tag" >> $env:GITHUB_OUTPUT
          echo "VERSION_NUMERIC=$numeric" >> $env:GITHUB_OUTPUT
        shell: pwsh

      - name: Publish application
        run: >
          dotnet publish Systems_One_MQTT_Service.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          --output ./publish
          -p:PublishSingleFile=false

      - name: Build Inno Setup Installer
        uses: Minionguyjpro/Inno-Setup-Action@v1.2.2
        with:
          path: setup.iss
          options: /O+ /DMyAppVersion=${{ steps.version.outputs.VERSION_NUMERIC }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.VERSION }}
          name: "Release ${{ steps.version.outputs.VERSION }}"
          body: |
            Automated release built from commit ${{ github.sha }}.

            ### What's included
            - `Systems_One_MQTT_Service_Setup.exe` — Windows installer for the MQTT Service

            ### Installation
            Run the installer as Administrator. It will automatically install and start the Windows Service.

            ### Post-install: Set credentials
            Create `appsettings.Production.json` in the install directory with your Database and MQTT credentials.
            See `appsettings.Production.json.example` for the format.
          files: installer_output/Systems_One_MQTT_Service_Setup.exe
          draft: false
          prerelease: false
